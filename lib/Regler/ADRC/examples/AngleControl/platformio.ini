[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
lib_deps =
    ; Wenn die ADRC-Bibliothek als eigenes Git-Repo gepflegt wird, hier
    ; die URL eintragen, z.B.:
    ; https://github.com/DEIN_USER/ADRC.git
    ;
    ; Alternativ: den Ordner "ADRC-Library" einfach nach
    ;   lib/ADRC/
    ; dieses Projekts kopieren -> PlatformIO bindet ihn automatisch ein,
    ; lib_deps ist dann nicht noetig.
monitor_speed = 115200
build_flags = -O2
