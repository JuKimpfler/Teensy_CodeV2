; ============================================================
;  Koalas 2027 — Teensy 4.0 PlatformIO Konfiguration
; ============================================================
;  Die PDS-Bibliothek (Telemetrie/Fernsteuerung) liegt in lib/PDS und ist
;  eine Kopie aus dem Repository Robotic_PDS. Aktualisiert wird sie mit
;      python tools/sync_pds.py
;  Kanalbelegung: docs/PDS_Belegung.md
[env:teensy40]
platform  = teensy
board     = teensy40
framework = arduino

monitor_speed   = 250000
;upload_protocol = teensy-cli


; CPU-Takt. 600 MHz ist die Nennfrequenz des i.MX RT1062, alles darueber ist Uebertakten.
; Der Teensy-Core hebt dafuer die Kernspannung an (clockspeed.c): 816 MHz = 1,425 V, 912 MHz = 1,525 V,
; 1008 MHz = 1,575 V (NXP empfiehlt max. 1,3 V). Dazu wird der Chip heisser; bei 85 / 90 Grad C
; loest der Core Alarm aus bzw. haelt an. Die Chiptemperatur steht in PDS-Kanal 29 (CPU_Temp).
; Waehlbar: 600 / 720 / 816 / 912 / 960 / 1008 MHz. 912 MHz ist der hoechste Takt mit Nachweis im Team
; (Pathfinding-Messreihe). Stoesst CPU_Temp im Spiel dauerhaft an ~80 Grad C: 816 MHz nehmen
; oder Kuehlkoerper aufkleben. 960 / 1008 MHz nur mit Kuehlkoerper.  912000000L
board_build.f_cpu = 912000000L

; Registriert zusaetzliche "Custom Targets" (Build+BT-Upload Node1/2/beide),
; sichtbar im PlatformIO-Sidebar unter Project Tasks -> teensy40 -> Custom.
extra_scripts   = post:extra_script.py

build_flags =
    -DBUILD_DATE=__DATE__     ; Versionierungsvariablen
    -DBUILD_TIME=__TIME__
    -DBUILD_VERSION=\"0.0.1\"
    -DUSB_SERIAL              ; USB als serielle Schnittstelle (fuer printStatus())
    -O2                       ; Optimierungsstufe 2
    -Wall                     ; Warnungen einschalten - faengt Tippfehler frueh ab
    -DACTIVE_CHANNELS=200     ; Kanaele mit Namen/Bindung (<= MAX_FLOATS=200)

    ; Kanal 0..31 gehoeren systemlib::setupPDS() und sind fest vergeben --
    ; die Overlays in lib/PDS/channel_config.h zeigen auf diese Nummern.
    ; Ab 32 vergeben PDS.plot()/PDS.track() im Sketch automatisch weiter.
    ; OHNE dieses Flag wuerde der Sketch die Systemkanaele ueberschreiben.
    -DPDS_AUTO_CHANNEL_BASE=32

    ; Debug-UART: Main V2.0 fuehrt den DBG-INTERCON auf Teensy 0/1 = Serial1.
    ; Muss hier stehen, weil lib/PDS/params_PDS.h (Default Serial3) enum.h
    ; nicht sieht und beim Sync mit Robotic_PDS ueberschrieben wird.
    -DUART_DBG=Serial1

    ;-D_Mode_Game=0
    ;-D_Mode_Test=1

    ; Debbugg Modus: 
    ;   1. Game (Build ohne Debbugg signale / Laufzeit Optimierung)
    ;   2. Test (Build mit PDS / Seriellen Ausgaben / kann verzögerte Laufzeit zur volge haben)
    ;-DPDS_Mode = D_Mode_Game

    ; setupPDS() vergibt allein schon 22 Einheiten ("V", "cm", "°", ...), der
    ; Default von 32 laesst dem Sketch also kaum Luft. 48 Eintraege kosten
    ; 432 Byte RAM; ohne Reserve verwirft PDS.setUnit() die Einheit nur.
    -DPDS_MAX_UNITS=48

;   -DPDS_DESC_REPEAT_MS=5000 ; Kanalnamen ohne GUI alle 5 s wiederholen (0 = aus)
;   -DPDS_DESC_BUF_BYTES=24576 ; Deskriptor-Puffer (OCRAM); Ueberlauf meldet
;                              ; tools/desc_json_check.py im PDS-Repo
;   -DPDS_EVENT_QUEUE_SIZE=8  ; Warteschlange fuer PDS.event()/PDS.log()
;   -DPDS_FW_VERSION='"1.4.2"' ; Version der Roboter-Firmware fuer die GUI
;                              ; (setzt systemlib::setupPDS() sonst selbst)
;   -DPDS_MAX_SETTINGS=32     ; Oberflaechen-Einstellungen aus GUI_SETTINGS[]
;   ── Blockierfreiheit (PDS 2.2, siehe lib/PDS/README.md) ─────────────────
;   -DPDS_UPDATE_BUDGET_US=400   ; Zeitbudget je update() fuer alles ausser
;                                ; Telemetrie und Param-Empfang
;   -DPDS_UPDATE_PANIC_US=5000   ; ab hier gilt ein update() als Fehlfunktion
;   -DPDS_UPDATE_PANIC_STRIKES=5 ; so oft, bevor die Notbremse greift (0 = aus)
;   -DPDS_RX_BYTE_BUDGET=1024    ; empfangene Bytes je update()
