; ESP32-S3-Firmware (Seeed XIAO ESP32S3): Sensor-Koprozessor fuer den Teensy.
; Bauen:  pio run -d esp        Flashen: pio run -d esp -t upload
; Die Treiber (BNO055, Link, ...) und alle Parameter kommen aus ../lib, nichts wird kopiert.
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.f_cpu = 240000000L
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_ldf_mode = chain
; Nur Teensy: nicht auf dem ESP bauen
lib_ignore =
    systemlib
    PDS
    Regler
    Pathfinder
    Cam
    INA219
    TCA9534DW
    ADC108S102
    fancyBTN
    commlib
    SensorLink
    SRF08
    PMW3389
build_flags =
    -DESP_TARGET=1
    -DARDUINO_USB_CDC_ON_BOOT=1  ; Serial = USB (Debug), Serial1 = Link zum Teensy
    ; Sensorquellen (DEBUG-FLAG, lib/include/params/params_sources.h). MUSS dem Wert im Teensy-platformio.ini entsprechen
    ; (die Pruefsumme im HELLO meldet einen Unterschied). 0 = der ESP fasst den I2C-Bus nicht an, 1 = alles am ESP.
    ;-DSENSOR_SOURCE=1
    ;   einzeln: -DHEADING_SOURCE=0|1  -DRADAR_SOURCE=0|1  -DIR_SOURCE=0|1
    -O2
    -Wall
    -DBUILD_VERSION=\"0.0.1\"
